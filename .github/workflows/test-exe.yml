name: Test Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Download the portable EXE
        shell: pwsh
        run: gh release download desktop --pattern "English-Learning-App-Portable.exe" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run it and take a screenshot
        shell: pwsh
        run: |
          Start-Process -FilePath ".\English-Learning-App-Portable.exe"
          Start-Sleep -Seconds 40
          $p = Get-Process | Where-Object { $_.ProcessName -like "English*" }
          if ($p) { Write-Host "RUNNING: $($p.Count) process(es)" } else { Write-Host "NOT RUNNING" }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\test-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $p) { exit 1 }

      - name: Upload screenshot to Releases
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Windows EXE
          files: test-screenshot.png
