name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Build the EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Windows EXE
          files: |
            dist/English-Learning-App-Setup.exe
            dist/English-Learning-App-Portable.exe
